name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs: cancelling a main run could stop a deploy halfway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # mongodb-memory-server downloads a MongoDB binary on first use
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      # Fail on known high/critical vulnerabilities in what ships to production
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Deploys main to the home server through a self-hosted runner there (setup: docs/deployment.md).
  # Never runs for pull requests, so code from forks can't reach the server through this job.
  deploy:
    name: Deploy to production
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, jolly-deploy]
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      # No actions/checkout: the deploy runs in the existing checkout, which holds .env and backups/
      - name: Update the checkout
        run: |
          test -n "$DEPLOY_DIR" || { echo "Set the DEPLOY_DIR repository variable"; exit 1; }
          cd "$DEPLOY_DIR"
          test "$(git branch --show-current)" = main || { echo "$DEPLOY_DIR is not on main"; exit 1; }
          git fetch origin main
          # Fails instead of discarding local changes or commits on the server
          git merge --ff-only "$GITHUB_SHA"
      - name: Rebuild and restart
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: docker compose up -d --build --remove-orphans --wait --wait-timeout 300
      - name: Remove dangling images
        run: docker image prune -f
